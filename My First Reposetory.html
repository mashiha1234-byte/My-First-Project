P.pros=()=>head('Professionals','Compare verified-style demo professionals.')+`<div class="c sec"><p class="demo">All workers are mock data for prototype purposes.</p><div class="filters"><input id="q" placeholder="Search name or service…"><select id="fs"><option value="">All services</option>${SV.map(s=>`<option value="${s.id}">${s.n}</option>`).join("")}</select><select id="fr"><option value="0">Any rating</option><option value="4.5">4.5+</option><option value="4.8">4.8+</option></select><select id="fd"><option value="99">Any distance</option><option value="2">Within 2 km</option><option value="5">Within 5 km</option></select><select id="fa"><option value="">Any availability</option><option>Now</option><option>Today</option><option>Tomorrow</option></select></div><select id="fp" style="max-width:220px;margin-bottom:18px"><option value="9999">Any price</option><option value="400">Up to ₹400</option><option value="500">Up to ₹500</option></select><div id="pl"></div></div>`;
function pros(){profileModal();const run=()=>{const q=$('#q').value.toLowerCase(),f=PR.filter(p=>(!$('#fs').value||p.s==$('#fs').value)&&p.r>=+$('#fr').value&&p.km<=+$('#fd').value&&p.price<=+$('#fp').value&&(!$('#fa').value||p.av==$('#fa').value)&&(p.n+SV.find(s=>s.id==p.s).n).toLowerCase().includes(q));$('#pl').innerHTML=f.length?`<div class="grid">${f.map(proCard).join('')}</div>`:'<div class="empty">No professionals match. Try changing the filters.</div>'};
$('#pl').innerHTML='<div class="spin"></div>';setTimeout(run,450);$$('.filters input,.filters select,#fp').forEach(e=>e.oninput=run)}
function booking(){
 const q=new URLSearchParams(__q);let s={n:1,svc:q.get('s')||'',prob:'',urg:'',loc:'',img:'',desc:'',pro:q.get('p')||''};if(s.svc)s.n=2;
 const V=$('#b'),sv=()=>SV.find(x=>x.id==s.svc),est=()=>Math.round(sv().from*({Emergency:1.5,Today:1.2,Flexible:1}[s.urg]||1));
 const opt=(k,v,l)=>`<button class="opt ${s[k]==v?'sel':''}" data-k="${k}" data-v="${v}">${l}</button>`;
 const T=['Select service','Select problem','How urgent is it?','Your location','Upload a photo (optional)','Describe the issue','Estimated cost','Matching professionals','Confirm request'];
 function draw(){let b='',e='';
  if(s.n==1)b=`<div class="opts">${SV.map(x=>opt('svc',x.id,x.i+' '+x.n)).join('')}</div>`;
  if(s.n==2)b=`<div class="opts">${sv().p.map(x=>opt('prob',x,x)).join('')}</div>`;
  if(s.n==3)b=`<div class="opts">${['Emergency','Today','Flexible'].map(x=>opt('urg',x,x)).join('')}</div>`;
  if(s.n==4)b=`<label>Address / area</label><input id="loc" value="${esc(s.loc)}" placeholder="e.g. Sector 12, Delhi">`;
  if(s.n==5)b=`<input type="file" id="img" accept="image/*">${s.img?`<img class="prev" src="${s.img}" alt="Preview">`:''}`;
  if(s.n==6)b=`<textarea id="desc" rows="4" placeholder="Describe what happened…">${esc(s.desc)}</textarea>`;
  if(s.n==7)b=`<div class="card"><p class="mu">${sv().n} · ${esc(s.prob)} · ${s.urg}</p><h2 style="margin:8px 0">₹${est()}</h2><p class="mu">Demo estimate. Final price confirmed after inspection.</p></div>`;
  if(s.n==8){const l=PR.filter(p=>p.s==s.svc);b=`<div class="grid">${l.map(p=>`<button class="opt ${s.pro==p.id?'sel':''}" data-k="pro" data-v="${p.id}">${p.n}<br><span class="mu">${stars(p.r)} · ${p.km} km · ₹${p.price}</span></button>`).join('')}</div>`}
  if(s.n==9){const p=PR[s.pro];b=`<div class="card"><p><b>${sv().n}</b> – ${esc(s.prob)}</p><p class="mu">${s.urg} · ${esc(s.loc)}<br>Professional: ${p.n}<br>Estimate: ₹${est()}</p></div>`}
  V.innerHTML=`<div class="card"><p class="mu">Step ${s.n} of 9</p><div class="bar"><b style="width:${s.n*100/9}%"></b></div><h2 style="margin-bottom:16px">${T[s.n-1]}</h2>${b}<div id="e" class="err"></div><div class="row" style="margin-top:22px">${s.n>1?'<button class="btn" id="bk">Back</button>':'<a class="btn" href="services.html">Cancel</a>'}<button class="btn pr" id="nx">${s.n==9?'Confirm Request':'Next'}</button></div></div>`;
  $$('.opt').forEach(o=>o.onclick=()=>{s[o.dataset.k]=o.dataset.v;if(o.dataset.k=='svc')s.prob='';draw()});
  if($('#img'))$('#img').onchange=ev=>{const f=ev.target.files[0];if(!f)return;if(f.size>3e6)return toast('Image must be under 3 MB','er');const r=new FileReader();r.onload=()=>{s.img=r.result;draw()};r.readAsDataURL(f)};
  if($('#bk'))$('#bk').onclick=()=>{s.n--;draw()};
  $('#nx').onclick=()=>{if($('#loc'))s.loc=$('#loc').value.trim();if($('#desc'))s.desc=$('#desc').value.trim();
   const bad={1:!s.svc,2:!s.prob,3:!s.urg,4:s.loc.length<3,6:s.desc.length<5,8:s.pro===''}[s.n];
   if(bad){$('#e').textContent={1:'Please choose a service.',2:'Please choose a problem.',3:'Please choose urgency.',4:'Enter your location (min 3 characters).',6:'Add a short description (min 5 characters).',8:'Please choose a professional.'}[s.n];return}
   if(s.n<9){s.n++;draw()}else done()};
 }
 function done(){const r={id:'KS-'+Math.floor(1000+Math.random()*9000),svc:sv().n,prob:s.prob,urg:s.urg,loc:s.loc,desc:s.desc,cost:est(),pro:PR[s.pro].n,photo:!!s.img,status:0,date:new Date().toLocaleString()};const a=LS.get('reqs',[]);a.unshift(r);LS.set('reqs',a);
  V.innerHTML=`<div class="card ok-box"><div class="big">✅</div><h2>Request Created Successfully</h2><p class="mu">ID ${r.id} · ${r.pro} · ₹${r.cost}</p><div id="t">${trk(0)}</div><div class="row" style="justify-content:center"><button class="btn" id="adv">Simulate next status</button><a class="btn pr" href="dashboard.html">Go to Dashboard</a></div></div>`;toast('Request created','ok');
  $('#adv').onclick=()=>{const a=LS.get('reqs',[]);if(a[0].status<3)a[0].status++;LS.set('reqs',a);$('#t').innerHTML=trk(a[0].status);toast('Status: '+ST[a[0].status])}}
 draw()}
P.booking=()=>head('Book a Service','Complete 9 quick steps to create your request.')+`<div class="c sec" style="max-width:760px"><div id="b"></div></div>`;
function custDash(){const a=LS.get('reqs',[]),act=a.filter(r=>r.status<3&&!r.x),old=a.filter(r=>r.status==3||r.x);
 const rc=r=>`<div class="card" style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><b>${r.id} · ${esc(r.svc)}</b><span class="tag pu">${r.x?'Cancelled':ST[r.status]}</span></div><p class="mu">${esc(r.prob)} · ${esc(r.loc)} · ₹${r.cost} · Worker: ${esc(r.pro)}</p>${r.x?'':trk(r.status)}${r.status<3&&!r.x?`<button class="btn sm" data-a="adv" data-i="${r.id}">Simulate next status</button> <button class="btn sm er" data-a="can" data-i="${r.id}">Cancel</button>`:''}</div>`;
 const sp=LS.get('saved',[0,1]);
 return `<div class="stats"><div class="card"><b>${act.length}</b>Active</div><div class="card"><b>${old.length}</b>Previous</div><div class="card"><b>${sp.length}</b>Saved pros</div></div><h3>Active Requests</h3><br>${act.map(rc).join('')||'<div class="empty">No active requests. <a href="booking.html" style="color:var(--p)">Book a service</a></div>'}<br><h3>Previous Requests</h3><br>${old.map(rc).join('')||'<div class="empty">Nothing here yet.</div>'}<br><h3>Saved Professionals</h3><br><div class="grid">${sp.map(i=>proCard(PR[i])).join('')}</div>`}
function workDash(){const w=LS.get('wk',{on:true,earn:0,rate:4.8,jobs:[{id:'J-101',t:'Plumbing – Blocked drain',loc:'Sector 9',pay:450,s:'new'},{id:'J-102',t:'Plumbing – Tap leakage',loc:'Karol Bagh',pay:320,s:'new'},{id:'J-103',t:'Pipe leakage',loc:'Rohini',pay:520,s:'new'}]});window._w=w;
 const sec=(t,s,btn)=>{const l=w.jobs.filter(j=>j.s==s);return `<h3>${t}</h3><br>${l.map(j=>`<div class="card" style="margin-bottom:10px"><b>${j.t}</b><p class="mu">${j.loc} · ₹${j.pay} · ${j.id}</p>${btn(j)}</div>`).join('')||'<div class="empty">None</div>'}<br>`};
 return `<div class="stats"><div class="card"><b>₹${w.earn}</b>Earnings</div><div class="card"><b>${stars(w.rate)}</b>Rating</div><div class="card"><button class="btn sm" data-a="tg">${w.on?'🟢 Available':'⚪ Offline'} – toggle</button></div></div>${sec('Incoming Requests','new',j=>`<button class="btn pr sm" data-a="acc" data-i="${j.id}">Accept</button> <button class="btn sm er" data-a="rej" data-i="${j.id}">Reject</button>`)}${sec('Active Jobs','act',j=>`<button class="btn sm" data-a="way" data-i="${j.id}">On The Way</button> <button class="btn pr sm" data-a="fin" data-i="${j.id}">Mark Completed</button>`)}${sec('Completed Jobs','done',j=>'<span class="tag ok">Completed</span>')}`}
function dash(){const u=user();const V=$('#d');let tab=LS.get('tab','c');
 const draw=()=>{V.innerHTML=`<div class="tabs"><button data-t="c" class="${tab=='c'?'on':''}">Customer</button><button data-t="w" class="${tab=='w'?'on':''}">Worker</button></div>${tab=='c'?custDash():workDash()}`};draw();
 V.onclick=e=>{const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;LS.set('tab',tab);return draw()}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=b.dataset.i;
  if(a=='adv'||a=='can'){const r=LS.get('reqs',[]),x=r.find(q=>q.id==i);if(a=='adv'&&x.status<3)x.status++;else if(a=='can'){x.x=1;toast('Request cancelled')}LS.set('reqs',r)}
  else{const w=window._w,j=w.jobs.find(q=>q.id==i);if(a=='tg'){w.on=!w.on}if(a=='acc')j.s='act';if(a=='rej')w.jobs=w.jobs.filter(q=>q!=j);if(a=='way')toast('Customer notified: on the way','ok');if(a=='fin'){j.s='done';w.earn+=j.pay;toast('Job completed','ok')}LS.set('wk',w)}draw()}}
P.dashboard=()=>head('Dashboard','Manage requests, jobs and earnings.')+`<div class="c sec"><div id="d"></div></div>`;
P.workers=()=>`<section class="hero"><div class="c"><div><h1>Grow Your Work With KaamSetu.</h1><p>Receive nearby requests, set your availability and build your reputation.</p><a class="btn pr" href="#reg" onclick="document.getElementById('wf').scrollIntoView({behavior:'smooth'});return false">Register Now</a> <a class="btn" href="dashboard.html">Worker Dashboard</a></div><div class="grid" style="grid-template-columns:1fr">${['Steady local requests','Weekly earnings view','Control your availability'].map(x=>`<div class="card">✔ ${x}</div>`).join('')}</div></div></section>
<div class="c sec" style="max-width:640px"><form id="wf" class="card" novalidate><h2>Worker Registration</h2><label>Full name</label><input name="n"><label>Phone (10 digits)</label><input name="ph" inputmode="numeric"><label>Service category</label><select name="s">${SV.map(s=>`<option>${s.n}</option>`).join("")}</select><label>Experience (years)</label><input name="x" type="number" min="0" max="50"><label>Location</label><input name="l"><label>Availability</label><select name="a"><option>Full-time</option><option>Part-time</option><option>Weekends</option></select><div id="e" class="err"></div><button class="btn pr" style="margin-top:18px">Create Profile</button></form></div>`;
function workers(){$('#wf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),er=$('#e');
 if(f.get('n').trim().length<3)return er.textContent='Enter your full name.';if(!/^\d{10}$/.test(f.get('ph')))return er.textContent='Phone must be 10 digits.';if(f.get('x')===''||+f.get('x')<0)return er.textContent='Enter experience in years.';if(f.get('l').trim().length<3)return er.textContent='Enter your location.';
 LS.set('wprofile',Object.fromEntries(f));er.textContent='';toast('Worker profile created','ok');setTimeout(()=>go('dashboard.html'),900)}}
P.login=()=>head('Login / Sign Up','Authentication is simulated in this prototype.')+`<div class="c sec" style="max-width:460px"><div class="card"><div class="tabs"><button class="on" data-m="l">Login</button><button data-m="s">Sign Up</button></div><form id="lf" novalidate><div id="nm" style="display:none"><label>Full name</label><input name="n"></div><label>Email</label><input name="e" type="email"><label>Password (min 6)</label><input name="p" type="password"><div id="e" class="err"></div><button class="btn pr" style="width:100%;margin-top:16px" id="sb">Login</button></form><hr style="margin:18px 0;border:0;border-top:1px solid var(--br)"><div class="row"><button class="btn" id="gg">Continue with Google</button><button class="btn" id="gs">Continue as Guest</button><a class="btn" href="workers.html">Join as Worker</a></div><p class="mu" id="who" style="margin-top:14px"></p></div></div>`;
function login(){let m='l';const u=user();if(u)$('#who').innerHTML=`Signed in as <b>${esc(u.name)}</b>. <a href="#" id="lo" style="color:var(--p)">Log out</a>`;
 $$('[data-m]').forEach(b=>b.onclick=()=>{m=b.dataset.m;$$('[data-m]').forEach(x=>x.classList.toggle('on',x==b));$('#nm').style.display=m=='s'?'block':'none';$('#sb').textContent=m=='s'?'Create Account':'Login'});
 $('#lf').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),er=$('#e');if(m=='s'&&f.get('n').trim().length<2)return er.textContent='Enter your name.';if(!/^\S+@\S+\.\S+$/.test(f.get('e')))return er.textContent='Enter a valid email.';if(f.get('p').length<6)return er.textContent='Password must be at least 6 characters.';
  LS.set('user',{name:m=='s'?f.get('n'):f.get('e').split('@')[0],email:f.get('e')});toast('Welcome to KAAMSETU (simulated login)','ok');setTimeout(()=>go('dashboard.html'),800)};
 $('#gg').onclick=()=>toast('Google sign-in needs a backend and is not connected in this prototype','er');
 $('#gs').onclick=()=>{LS.set('user',{name:'Guest'});toast('Continuing as guest','ok');setTimeout(()=>go('index.html'),700)};
 if($('#lo'))$('#lo').onclick=e=>{e.preventDefault();localStorage.removeItem('ks_user');go('login.html')}}

let __cur='index.html',__q='';
const F2K={'index.html':'home','services.html':'services','booking.html':'booking','professionals.html':'pros','how-it-works.html':'how','workers.html':'workers','dashboard.html':'dashboard','faq.html':'faq','login.html':'login'};
const TT={home:'Home',services:'Services',booking:'Book a Service',pros:'Professionals',how:'How It Works',workers:'For Workers',dashboard:'Dashboard',faq:'FAQ & Help',login:'Login / Sign Up'};
function go(h){const a=h.split('?');__cur=a[0];__q=a[1]?'?'+a[1]:'';render();window.scrollTo(0,0)}
function render(){$$('header.nav,.ov,.dr,footer').forEach(e=>e.remove());const pg=F2K[__cur]||'home';document.title=TT[pg]+' | KAAMSETU - Problem Se Solution Tak';shell();$('#main').innerHTML=P[pg]();({pros,booking,dashboard:dash,workers,login})[pg]?.();if(['home','faq'].includes(pg))accInit();if(pg=='home')profileModal();document.body.style.overflow=''}
document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a)return;const h=a.getAttribute('href');if(/\.html/.test(h)){e.preventDefault();go(h)}});
render();
</script></body></html>
